services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      CLIENT_ORIGIN: http://localhost:8080
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads:
